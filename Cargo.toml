[package]
name = "mjolnr"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
description = "Local-first terminal AI coding harness with a Ratatui interface"
license = "Apache-2.0"
# Publishing to crates.io is a separate decision from the licence and has not
# been made. The licence no longer blocks it (AGENTS.md §8).
publish = false

[profile.release]
# Keep release artifacts reproducible and small enough for a terminal utility,
# while leaving enough symbol information in debug builds for local diagnosis.
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lib]
name = "smed"
path = "src/lib.rs"

[[bin]]
name = "mjolnr"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
# Image payloads on the wire. Every image-capable provider
# takes base64 — as a bare string, or wrapped in a `data:` URI. Already present
# transitively; named here because smed calls it directly and a transitive
# dependency is not a contract.
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
etcetera = "0.11.0"
eventsource-stream = "0.2.3"
futures-util = "0.3.32"
getrandom = "0.3"
# Decoding only, for the transcript's inline images. `ratatui-image` already
# links `image` for PNG but does not re-export it, so the decode call needs a
# direct handle. Codecs are named one by one rather than taking `default`:
# these four cover screenshots and pasted images, and every additional decoder
# is attack surface reached from a path in a message.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
keyring = { version = "4.1.5", features = ["apple-native-keyring-store"] }
jsonschema = { version = "0.47.0", default-features = false }
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, which is the
# only honest way to size the transcript's scroll range: it must agree with the
# wrapping the renderer actually performs, and a hand-rolled reimplementation
# would drift out of step and strand the newest output below the viewport.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
# Terminal graphics protocols (kitty/iTerm2/sixel) with a unicode-halfblock
# fallback, so image output degrades instead of failing on a plain terminal.
# `default-features = false` deliberately drops `chafa-dyn`/`chafa-static`:
# those link the system libchafa through `pkg-config`, and a C system
# dependency is exactly what the syntect `regex-fancy` choice above avoids.
# `image-defaults` is also off — the crate's own non-optional `image` feature
# set (PNG) is what the widget needs to decode; wider codec support would be a
# separate, justified `image` dependency.
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "http2"] }
rmcp = { version = "2.2.0", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
] }
rpassword = "7.5.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
similar = "3.1.1"
# Syntax highlighting for transcript code blocks and diffs (Phase 20). Minimal
# feature set: binary-dump default syntaxes plus the pure-Rust fancy-regex
# engine — no oniguruma C dependency, no theme/assets loading (smed builds its
# own palette), no html or yaml/plist loaders.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["serde-well-known"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "signal"] }
tokio-rusqlite = { version = "0.7.0", features = ["bundled"] }
tokio-util = "0.7.18"
portable-pty = "0.9.0"
tree-sitter = "0.26.11"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
uuid = { version = "1.23.5", features = ["v7", "serde"] }
vt100 = "0.16.2"
unicode-normalization = "0.1.25"
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.150"
tempfile = "3.27.0"
# Integration tests reach the crate's public API plus dev-dependencies only, so
# the same handle must be listed twice to let a test corrupt a database on
# purpose (duplicate ids, sequence gaps). It resolves to the one already in the
# graph — `cargo tree -i rusqlite` still shows a single version.
tokio-rusqlite = { version = "0.7.0", features = ["bundled"] }
# Adds fixed-instant literals for the Phase 14 cron scheduler's tests. Merges
# additively with the main `time` dependency, same technique as the
# `tokio-rusqlite` duplicate above.
time = { version = "0.3.53", features = ["macros"] }
wiremock = "0.6.5"

# Enforcement for AGENTS.md. Rules that are not mechanised decay.
[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Prime directives / stability (AGENTS.md §1, §4).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

# stdout is the alternate screen (AGENTS.md §4).
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# God-module backstop (AGENTS.md §2.3). Review guideline is stricter.
too_many_lines = "warn"
cognitive_complexity = "warn"

# Pedantic lints that fight the codebase rather than improve it.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
