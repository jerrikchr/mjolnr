<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			(function () {
				function show(msg) {
					try {
						var el = document.getElementById('smed-err');
						if (!el) {
							el = document.createElement('div');
							el.id = 'smed-err';
							el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#7f1d1d;color:#fff;font:12px/1.4 monospace;padding:10px;white-space:pre-wrap;';
							(document.documentElement || document.body).appendChild(el);
						}
						el.textContent = msg;
						document.title = 'ERR ' + String(msg).slice(0, 120);
					} catch (e) {}
				}
				window.addEventListener('error', function (e) {
					var msg = e && (e.message || (e.error && (e.error.stack || e.error.message || String(e.error))));
					show('window.error: ' + (msg || 'unknown'));
				});
				window.addEventListener('unhandledrejection', function (e) {
					var r = e && e.reason;
					var msg = r && (r.stack || r.message || String(r));
					show('unhandledrejection: ' + (msg || 'unknown'));
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
