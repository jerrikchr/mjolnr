# cargo-deny policy. Backs AGENTS.md §8 (dependencies and provenance).
#
# mjolnr is intended to become open source, so provenance must be reviewable
# from the first commit. This file is the mechanical half of that promise;
# THIRD_PARTY.md is the human-readable half.

[graph]
# Check the platforms mjolnr ships to. Windows is deliberately absent: the plan
# forbids advertising Windows support until it is actually tested there.
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every ignore needs a dated justification. An empty list is the goal state.
ignore = [
    # 2026-07-23 (Phase 20): bincode 1.3.3 arrives transitively via syntect's
    # `dump-load` feature, which deserialises syntect's own crate-bundled
    # binary syntax assets — trusted data, never user input. The advisory is
    # "unmaintained" (no vulnerability), no safe upgrade exists, and syntect
    # 5.3.0 has no bincode-free path for loading default syntaxes. If syntect
    # migrates serializers, this ignore goes with the upgrade. Recorded in the
    # Phase 20 report.
    { id = "RUSTSEC-2025-0141", reason = "transitive via syntect dump-load; unmaintained-only; trusted bundled assets; no safe upgrade" },
]

[licenses]
version = 2
confidence-threshold = 0.93

# Permissive licences only. mjolnr itself is Apache-2.0, so a copyleft
# dependency would force a relicence rather than merely widen this list —
# which is why the constraint stays even now that the choice is made.
# This list is deliberately trimmed to licences actually encountered in the
# linked graph for the targets above. Adding a dependency that introduces a new
# licence will fail this check — that failure is the point. Widen this list as a
# recorded decision in the report, never reflexively to make CI green.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
]

# `mjolnr` declares `license = "Apache-2.0"`, which is in the allow list above,
# so our own package is checked like any other. The `private.ignore` escape
# hatch is deliberately absent: `publish = false` should not buy an exemption
# from the licence policy this file exists to enforce.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nothing is banned outright yet. Candidates if they ever appear transitively:
# openssl-sys (we chose rustls), and any unofficial provider SDK (AGENTS.md §8).
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies. AGENTS.md §8 forbids vendoring agent-repository code,
# and a git dependency is the easiest way to do that by accident.
allow-git = []
